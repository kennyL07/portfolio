<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&display=swap"

  <body>
    <nav class="project-nav">
      <div class="project-nav-inner">
        <a href="/">Home</a>
        <a href="/#projects">Projects</a>
        <a href="/#contact">Contact</a>
      </div>
    </nav>
    <main id="main" class="project-page" tabindex="-1">
      <header class="project-header">
        <h1>FRC Robotics Competition 2026</h1>
        <p>Role and other information</p>
        <p class="project-status">aug. 2025 - apr. 2026</p>
      </header>

      <figure class="project-gallery" data-caption="Caption Placeholder">
        <div class="gallery-main">
          <button class="gallery-image" type="button">
            <img src="/src/assets/projects/frc-2026/Robot.png" alt="FRC Robotics Competition 2026 robot" />
          </button>
        </div>
        <div class="gallery-controls">
          <button class="gallery-previous" type="button" disabled>&#9664;</button>
          <div class="gallery-thumbnails">
            <button type="button" class="gallery-thumbnail is-selected">
              <img src="/src/assets/projects/frc-2026/Robot.png" alt="FRC Robotics Competition 2026 image 1" loading="lazy" />
            </button>
            <button type="button" class="gallery-thumbnail">
              <video src="/src/assets/projects/frc-2026/final_product.mp4" poster="/src/assets/projects/frc-2026/Robot.png" preload="none" muted playsinline></video>
            </button>
            <button type="button" class="gallery-thumbnail">
              <video src="/src/assets/projects/frc-2026/fixed_aim_shoot_slow.mp4" poster="/src/assets/projects/frc-2026/Robot.png" preload="none" muted playsinline></video>
            </button>
            <button type="button" class="gallery-thumbnail">
              <video src="/src/assets/projects/frc-2026/jamming.mp4" poster="/src/assets/projects/frc-2026/Robot.png" preload="none" muted playsinline></video>
            </button>
          </div>
          <button class="gallery-next" type="button">&#9654;</button>
        </div>
        <figcaption class="gallery-caption">Caption Placeholder</figcaption>
      </figure>

      <section class="project-content">
        <h2 id="project-overview">About this project</h2>
        <p>text under construction</p>
      </section>
    </main>

    <dialog class="gallery-lightbox">
      <button class="gallery-close" type="button">x</button>
      <img alt="" />
    </dialog>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
