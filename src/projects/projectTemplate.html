    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pridi:wght@200;300;400;500;600;700&amp;display=swap"

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body>
    <nav class="project-nav">
      <div class="project-nav-inner">
        <a href="/">Home</a>
        <a href="/#projects">Projects</a>
        <a href="/#contact">Contact</a>
      </div>
    </nav>
    <main id="main" class="project-page" tabindex="-1">
      <header class="project-header">
        <h1>Project Title Placeholder</h1>
        <p>Role and other information</p>
        <p class="project-status">mon. year - mon. year</p>
      </header>

      <figure class="project-gallery">
        <button class="gallery-main" type="button">
          <img
            src="/src/assets/project-template.png"
            alt="Project Placeholder"
          />
        </button>
        <div class="gallery-controls">
          <button class="gallery-previous" type="button" disabled>◀</button>
          <div class="gallery-thumbnails">
            <button type="button" class="gallery-thumbnail" is-selected>
              <img
                src="/src/assets/project-template.png"
                alt="Project Placeholder"
                loading="lazy"
              />
            </button>
            <button type="button" class="gallery-thumbnail">
              <img
                src="/src/assets/project-template.png"
                alt="Youtube video placeholder"
                data-url="insert youtube embed link here"
              />
            </button>
            <button type="button" class="gallery-thumbnail">
              <video src="insert src video link here" poster="poster image placeholder" preload="none" muted playsinline></video>
            </button>
          </div>
          <button class="gallery-next" type="button">▶</button>
        </div>
        <figcaption class="gallery-caption">Caption Placeholder</figcaption>
      </figure>

      <section class="project-content">
        <h2 id="project-overview">About this project</h2>
        <p>text under construction</p>
      </section>
    </main>

    <dialog class="gallery-lightbox">
      <button class="gallery-close" type="button">x</button>
      <img alt="" />
    </dialog>
    <script type="module" src="./gallery.ts"></script>
