<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans:opsz,wght@17..18,400..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Pridi:wght@200;300;400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="stylesheet" href="./project.css" />
    <meta
      name="description"
      content="VEX 2024 @ 2158Z"
      />
    <title>VEX Robotics Competition 2024 | Kennyson Le</title>
  </head>
  <body>
    <nav class="project-nav">
      <div class="project-nav-inner">
        <a href="/">Home</a>
        <a href="/#projects">Projects</a>
        <a href="/#contact">Contact</a>
      </div>
    </nav>
    <main id="main" class="project-page" tabindex="-1">
      <header class="project-header">
        <h1>VEX Robotics Competition 2024</h1>
        <p>Lead Programmer for Team 2158Z's Over Under season.</p>
        <p class="project-status">aug. 2023 - apr. 2024</p>
      </header>

      <figure class="project-gallery">
        <button class="gallery-main" type="button">
          <img
            src="/src/assets/projects/vex-2024/thumbnail.jpg"
            alt="Team 2158Z's Over Under robot"
          />
        </button>
        <div class="gallery-controls">
          <button class="gallery-previous" type="button" disabled>◀</button>
          <div class="gallery-thumbnails">
            <button type="button" class="gallery-thumbnail" is-selected>
              <img
                src="/src/assets/projects/vex-2024/awards.jpg"
                alt="Post-season awards"
                loading="lazy"
              />
            </button>
            <button type="button" class="gallery-thumbnail">
              <img
                src="https://img.youtube.com/vi/TtcsmGqScJI/default.jpg"
                alt="654X & 2158Z video reveal"
                data-url="https://www.youtube.com/embed/TtcsmGqScJI?si=IAMXPWAdpu7CE0pO"
              />
            </button>
            <button type="button" class="gallery-thumbnail">
              <img
                src="/src/assets/projects/vex-2024/Worlds.jpg"
                alt="2024 VEX Robotics World Championship Entrance"
                loading="lazy"
              />
            </button>
            <button type="button" class="gallery-thumbnail">
              <img
                src="/src/assets/projects/vex-2024/Regions.jpg"
                alt="Tournament champions at the 2024 Texas Region 4 Championship"
                loading="lazy"
              />
            </button>
            <button type="button" class="gallery-thumbnail">
              <img
                src="/src/assets/projects/vex-2024/UIL.jpg"
                alt="2024 UIL state runner-up trophy"
                loading="lazy"
              />
            </button>
            <button type="button" class="gallery-thumbnail">
              <img
                src="/src/assets/projects/vex-2024/UIL_robot.png"
                alt="2024 UIL state runner-up trophy and Robot"
                loading="lazy"
              />
            </button>
            <button type="button" class="gallery-thumbnail">
              <img
                src="/src/assets/projects/vex-2024/hang.jpg"
                alt="Overunder hang mechanism in action"
                loading="lazy"
              />
            </button>
            <button type="button" class="gallery-thumbnail">
              <img
                src="/src/assets/projects/vex-2024/worlds1.png"
                alt="Overunder Robot CAD"
                loading="lazy"
              />
            </button>
            <button type="button" class="gallery-thumbnail">
              <img
                src="/src/assets/projects/vex-2024/thumbnail.jpg"
                alt="Team 2158Z's Over Under robot"
              />
            </button>
          </div>
          <button class="gallery-next" type="button">▶</button>
        </div>
        <figcaption class="gallery-caption">
          Team 2158Z's Over Under robot
        </figcaption>
      </figure>

      <section class="project-content">
        <h2 id="project-overview">About this project</h2>
        <p>text under construction</p>
      </section>
    </main>

    <dialog class="gallery-lightbox">
      <button class="gallery-close" type="button">x</button>
      <img alt="" />
    </dialog>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
